server {
    listen 80;
    server_name kapistudios.kich.dev.br;
    root /var/www/kapistudios;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

server {
    listen 443 ssl;
    server_name kapistudios.kich.dev.br;
    root /var/www/kapistudios;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kich.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kich.dev.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
