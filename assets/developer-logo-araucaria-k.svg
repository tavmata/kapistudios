<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Madeira Escura / Tronco Imbuia -->
    <linearGradient id="kWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c3b24"/>
      <stop offset="60%" stop-color="#452317"/>
      <stop offset="100%" stop-color="#24120a"/>
    </linearGradient>

    <!-- Casca do Pinhão (Terracota & Castanho Quente) -->
    <linearGradient id="kPinhao" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Folhagem Verde Musgo Fosca (Sem neon) -->
    <linearGradient id="kMoss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e8055"/>
      <stop offset="60%" stop-color="#2d5a37"/>
      <stop offset="100%" stop-color="#183620"/>
    </linearGradient>

    <!-- Ouro Velho / Pinhão Assado -->
    <linearGradient id="kGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <g id="monograma-k-araucaria">
    <!-- Haste Vertical do "K": Tronco Maciço da Araucária com base de raízes -->
    <path d="M 36 102 C 37 80 38 48 38 22 H 45 C 45 48 46 80 47 102 Z" fill="url(#kWood)"/>
    <path d="M 33 103 C 38 100 45 100 50 103 C 48 105 35 105 33 103 Z" fill="#24120a"/>
    <line x1="41.5" y1="22" x2="41.5" y2="102" stroke="#1c0b05" stroke-width="0.9" opacity="0.6"/>

    <!-- Copa Topo da Haste (Equilíbrio e formato de taça da Araucária) -->
    <path d="M 38 28 C 30 28 24 22 25 15" fill="none" stroke="url(#kWood)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="25" cy="15" r="4.2" fill="url(#kMoss)"/>
    <circle cx="24.5" cy="14.5" r="2.6" fill="#60a5fa" opacity="0"/> <!-- no neon -->
    <circle cx="41.5" cy="16" r="4.6" fill="url(#kMoss)"/>
    <circle cx="41" cy="15.5" r="2.8" fill="#588d5e"/>

    <!-- Nódulo Central / Semente de Pinhão (Onde as hastes do K se encontram) -->
    <path d="M 43 50 C 49 50 53 58 53 66 C 53 73 47 79 43 82 C 39 79 33 73 33 66 C 33 58 37 50 43 50 Z" 
          fill="url(#kPinhao)" stroke="#24120a" stroke-width="0.8"/>
    <circle cx="43" cy="65" r="3" fill="url(#kGold)"/>
    <circle cx="42.5" cy="64.5" r="1.2" fill="#ffffff" opacity="0.9"/>

    <!-- Braço Superior do "K": Galho em Candelabro Ascendente -->
    <path d="M 45 56 C 54 56 66 48 78 36 C 84 30 90 28 96 28" fill="none" stroke="url(#kWood)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 68 45 C 74 38 80 32 84 23" fill="none" stroke="url(#kWood)" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Rosetas de Folhagem no Braço Superior -->
    <circle cx="96" cy="28" r="5.2" fill="url(#kMoss)"/>
    <circle cx="95" cy="27" r="3.2" fill="#588d5e"/>
    
    <circle cx="84" cy="23" r="4.2" fill="url(#kMoss)"/>
    <circle cx="83.5" cy="22.5" r="2.4" fill="#588d5e"/>

    <circle cx="74" cy="38" r="3.6" fill="url(#kMoss)"/>

    <!-- Perna Inferior do "K": Galho em Candelabro Descendente e Curvado -->
    <path d="M 45 64 C 56 68 70 80 82 90 C 87 94 92 95 97 90" fill="none" stroke="url(#kWood)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 78 85 C 84 83 88 77 91 68" fill="none" stroke="url(#kWood)" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Rosetas de Folhagem na Perna Inferior -->
    <circle cx="97" cy="90" r="5.2" fill="url(#kMoss)"/>
    <circle cx="96" cy="89" r="3.2" fill="#588d5e"/>

    <circle cx="91" cy="68" r="4.4" fill="url(#kMoss)"/>
    <circle cx="90.5" cy="67.5" r="2.6" fill="#588d5e"/>

    <circle cx="76" cy="81" r="3.6" fill="url(#kMoss)"/>
  </g>
</svg>
